<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>扫码出库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #e9f0f5; font-family: 'Segoe UI', sans-serif; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 500px; width: 100%; margin: 0 auto; }
        .card { background: white; border-radius: 28px; padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 16px; }
        .title { font-size: 1.5rem; font-weight: bold; color: #1f6e8c; margin-bottom: 20px; text-align: center; }
        .info-row { display: flex; padding: 10px 0; border-bottom: 1px solid #e2edf5; }
        .info-label { width: 80px; font-weight: bold; color: #5e7e97; }
        .info-value { flex: 1; font-weight: 500; color: #1f6e8c; }
        .status-box { background: #f0f6fa; border-radius: 16px; padding: 16px; margin: 20px 0; text-align: center; }
        .status-success { background: #e8f5e9; color: #2e7d32; }
        .status-warning { background: #fff3e0; color: #f57c00; }
        .status-error { background: #ffebee; color: #c62828; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 40px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 16px; }
        .btn-primary { background: #1f6e8c; color: white; }
        .btn-primary:active { background: #0e5a74; }
        .btn-disabled { background: #ccc; color: #666; cursor: not-allowed; }
        .loading { text-align: center; padding: 40px; color: #5e7e97; }
        .error-text { color: #c62828; text-align: center; margin-top: 16px; }
        .out-time { font-size: 0.8rem; color: #2e7d32; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="title">📷 扫码出库</div>
        <div id="content">
            <div class="loading">加载中...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://xngvmdoewlmxnsthbqxw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuZ3ZtZG9ld2xteG5zdGhicXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NjM3MzMsImV4cCI6MjA5NTMzOTczM30.Djx4HvAyqHtjVSoIq_puI5Km0uSq_pHkzGQ-Rfz-p9s';

    let supabase;
    let tagData = null;
    let tagId = null;

    async function initSupabase() {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function getTagIdFromUrl() {
        let params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    async function loadTagInfo() {
        tagId = getTagIdFromUrl();
        if (!tagId) {
            document.getElementById('content').innerHTML = `
                <div class="status-box status-error">
                    <div>❌ 无效的二维码</div>
                    <div style="font-size:0.8rem; margin-top:8px;">未找到标签ID</div>
                </div>
            `;
            return;
        }

        let { data, error } = await supabase
            .from('tag_records')
            .select('*')
            .eq('tag_id', tagId)
            .single();

        if (error || !data) {
            document.getElementById('content').innerHTML = `
                <div class="status-box status-error">
                    <div>❌ 未找到产品信息</div>
                    <div style="font-size:0.8rem; margin-top:8px;">标签ID: ${tagId}</div>
                </div>
            `;
            return;
        }

        tagData = data;
        renderPage();
    }

    function renderPage() {
        let isOut = tagData.status === '已出库';
        let outTimeHtml = '';
        if (isOut && tagData.out_time) {
            let outDate = new Date(tagData.out_time).toLocaleString('zh-CN');
            outTimeHtml = `<div class="out-time">📅 出库时间：${outDate}</div>`;
        }

        let infoHtml = `
            <div class="info-row"><div class="info-label">📦 规格</div><div class="info-value">${escapeHtml(tagData.spec)}</div></div>
            <div class="info-row"><div class="info-label">🎨 色号</div><div class="info-value">${escapeHtml(tagData.color)}</div></div>
            <div class="info-row"><div class="info-label">🔧 机号</div><div class="info-value">${escapeHtml(tagData.machine)}</div></div>
            <div class="info-row"><div class="info-label">🔢 数量</div><div class="info-value">${escapeHtml(tagData.qty)} 个</div></div>
            <div class="info-row"><div class="info-label">⚖️ 毛重</div><div class="info-value">${tagData.gross} kg</div></div>
            <div class="info-row"><div class="info-label">🧴 筒重</div><div class="info-value">${tagData.tong} kg</div></div>
            <div class="info-row"><div class="info-label">📦 箱重</div><div class="info-value">${tagData.box} kg</div></div>
            <div class="info-row"><div class="info-label">🔴 净重</div><div class="info-value"><strong style="color:#c00; font-size:1.1rem;">${tagData.net} kg</strong></div></div>
            <div class="info-row"><div class="info-label">📦 包装</div><div class="info-value">${escapeHtml(tagData.handler)}</div></div>
            <div class="info-row"><div class="info-label">🏷️ 批号</div><div class="info-value">${escapeHtml(tagData.batch)}</div></div>
            <div class="info-row"><div class="info-label">📅 生产日期</div><div class="info-value">${tagData.date}</div></div>
        `;

        if (isOut) {
            document.getElementById('content').innerHTML = `
                ${infoHtml}
                <div class="status-box status-warning">
                    <div>⚠️ 该产品已经出库</div>
                    ${outTimeHtml}
                    <div style="font-size:0.8rem; margin-top:8px;">不可重复出库</div>
                </div>
            `;
        } else {
            document.getElementById('content').innerHTML = `
                ${infoHtml}
                <div class="status-box status-success">
                    <div>✅ 待出库</div>
                    <div style="font-size:0.8rem; margin-top:4px;">净重: ${tagData.net} kg</div>
                </div>
                <button class="btn btn-primary" id="confirmBtn">📤 确认出库</button>
            `;
            document.getElementById('confirmBtn').onclick = confirmOut;
        }
    }

    async function confirmOut() {
        if (!tagData || tagData.status === '已出库') {
            alert('该产品已经出库，无法重复出库');
            return;
        }

        if (!confirm(`确认出库 ${tagData.net} kg 吗？`)) return;

        let btn = document.getElementById('confirmBtn');
        btn.disabled = true;
        btn.innerText = '处理中...';
        btn.classList.add('btn-disabled');

        try {
            // 1. 更新标签状态为已出库
            let { error: updateError } = await supabase
                .from('tag_records')
                .update({ status: '已出库', out_time: new Date().toISOString() })
                .eq('tag_id', tagId);

            if (updateError) throw updateError;

            // 2. 添加出仓记录
            let today = new Date().toISOString().slice(0, 10);
            let { error: outError } = await supabase
                .from('out_records')
                .insert({
                    id: Date.now().toString(),
                    customer: '扫码出库',
                    model: tagData.spec,
                    weight: parseFloat(tagData.net),
                    date: today
                });

            if (outError) throw outError;

            alert(`出库成功！出库重量：${tagData.net} kg`);
            
            // 刷新页面显示已出库状态
            tagData.status = '已出库';
            tagData.out_time = new Date().toISOString();
            renderPage();

        } catch (err) {
            console.error('出库失败:', err);
            alert('出库失败：' + err.message);
            btn.disabled = false;
            btn.innerText = '📤 确认出库';
            btn.classList.remove('btn-disabled');
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function init() {
        await initSupabase();
        await loadTagInfo();
    }

    init();
</script>
</body>
</html>
