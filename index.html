<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>纺织管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#e9f0f5;font-family:system-ui;padding:16px}
        .app{max-width:1400px;margin:0 auto;background:#fff;border-radius:24px;overflow:hidden}
        .top{background:#fff;padding:12px 20px;border-bottom:1px solid #e2e9f0;display:flex;justify-content:space-between;align-items:center}
        h1{font-size:1.2rem;color:#1f6e8c}
        .tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #e2edf5}
        .tab{padding:10px 18px;cursor:pointer;font-weight:600;color:#5e7e97;border-bottom:2px solid transparent}
        .tab.active{color:#1f6e8c;border-bottom-color:#1f6e8c}
        .main{padding:16px}
        .cards{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .card{background:#f0f6fa;border-radius:16px;padding:10px 16px;flex:1;min-width:100px;cursor:pointer}
        .card h3{font-size:.65rem;color:#5e7e97}
        .card .num{font-size:1.3rem;font-weight:700;color:#1f6e8c}
        table{width:100%;border-collapse:collapse}
        th,td{border:1px solid #e2edf5;padding:8px 6px;text-align:left;font-size:.7rem}
        th{background:#eef3fc}
        .form-box{background:#f7fafd;border-radius:16px;padding:12px;margin-bottom:16px}
        .row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
        .field{display:flex;flex-direction:column;gap:3px}
        .field label{font-size:.6rem;font-weight:600}
        .field input{border:1px solid #cbdbe6;border-radius:10px;padding:5px 8px;width:110px}
        button{background:#1f6e8c;color:#fff;border:none;padding:5px 14px;border-radius:25px;cursor:pointer}
        .btn-del{background:0 0;color:#c44536;border:none;cursor:pointer;padding:4px 8px}
        .empty{text-align:center;padding:30px;color:#8aaec0}
        .status{display:inline-block;padding:2px 8px;border-radius:15px;font-size:.65rem}
        .status-pending{background:#fff3e0;color:#f57c00}
        .status-done{background:#e8f5e9;color:#388e3c}
        @media(max-width:700px){.field input{width:90px}}
    </style>
</head>
<body>
<div class="app">
    <div class="top"><h1>🏭 纺织管理系统</h1></div>
    <div class="tabs">
        <div class="tab active" data-tab="dash">📊 仪表盘</div>
        <div class="tab" data-tab="in">📥 入仓</div>
        <div class="tab" data-tab="out">📤 出仓</div>
        <div class="tab" data-tab="order">📋 订单</div>
        <div class="tab" data-tab="print">🖨️ 标签</div>
    </div>
    <div class="main" id="main"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL = 'https://xngvmdoewlmxnsthbqxw.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuZ3ZtZG9ld2xteG5zdGhicXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NjM3MzMsImV4cCI6MjA5NTMzOTczM30.Djx4HvAyqHtjVSoIq_puI5Km0uSq_pHkzGQ-Rfz-p9s';

let supabase = window.supabase.createClient(SB_URL, SB_KEY);
let ins=[], outs=[], orders=[];

async function loadAll(){
    let {data:i}=await supabase.from('in_records').select('*'); ins=i||[];
    let {data:o}=await supabase.from('out_records').select('*'); outs=o||[];
    let {data:od}=await supabase.from('order_progress').select('*'); orders=od||[];
    render();
}

function render(){
    let today=new Date().toISOString().slice(0,10);
    let inToday=ins.filter(i=>i.date===today&&!i.is_waste).reduce((s,i)=>s+(+i.weight||0),0);
    let outToday=outs.filter(o=>o.date===today).reduce((s,o)=>s+(+o.weight||0),0);
    let pending=ins.filter(i=>(i.customer==='待分配'||!i.customer)&&!i.is_waste).length;
    let pendingOrd=orders.filter(o=>o.status==='待生产').length;
    let stock=ins.reduce((s,i)=>s+(+i.weight||0),0)-outs.reduce((s,o)=>s+(+o.weight||0),0);
    
    let html=`
        <div id="dashPage"><div class="cards"><div class="card" onclick="switchTab('in')"><h3>📥 今日入库</h3><div class="num">${inToday}</div></div><div class="card" onclick="switchTab('out')"><h3>📤 今日出库</h3><div class="num">${outToday}</div></div><div class="card" onclick="switchTab('in')"><h3>📋 待分配</h3><div class="num">${pending}</div></div><div class="card" onclick="switchTab('order')"><h3>⏳ 待生产</h3><div class="num">${pendingOrd}</div></div></div><div class="cards"><div class="card"><h3>📦 总库存</h3><div class="num">${stock}</div></div></div></div>
        <div id="inPage" style="display:none"><div class="form-box"><h4>➕ 添加入仓</h4><div class="row"><div class="field"><label>客户</label><input type="text" id="inCus" placeholder="留空待分配"></div><div class="field"><label>型号</label><input type="text" id="inModel"></div><div class="field"><label>重量</label><input type="number" id="inWeight"></div><div class="field"><label>日期</label><input type="date" id="inDate"></div><button id="addInBtn">✅ 添加</button></div></div><div><table><thead><tr><th>客户</th><th>型号</th><th>重量</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="inList"></tbody></table></div></div>
        <div id="outPage" style="display:none"><div class="form-box"><h4>📤 添加出仓</h4><div class="row"><div class="field"><label>客户</label><input type="text" id="outCus"></div><div class="field"><label>型号</label><input type="text" id="outModel"></div><div class="field"><label>重量</label><input type="number" id="outWeight"></div><div class="field"><label>日期</label><input type="date" id="outDate"></div><button id="addOutBtn">✅ 添加</button></div></div><div><tr><thead><tr><th>客户</th><th>型号</th><th>重量</th><th>日期</th><th>操作</th><tr></thead><tbody id="outList"></tbody></table></div></div>
        <div id="orderPage" style="display:none"><div class="form-box"><h4>➕ 新增订单</h4><div class="row"><div class="field"><label>客户</label><input type="text" id="orderCus"></div><div class="field"><label>规格</label><input type="text" id="orderSpec"></div><div class="field"><label>数量</label><input type="number" id="orderQty"></div><div class="field"><label>备注</label><input type="text" id="orderRemark"></div><button id="addOrderBtn">✅ 新增</button></div></div><div><tr><thead><tr><th>订单号</th><th>客户</th><th>规格</th><th>数量</th><th>状态</th><th>备注</th><th>日期</th><th>操作</th></table></thead><tbody id="orderList"></tbody></table></div></div>
        <div id="printPage" style="display:none"><div class="form-box"><h4>🖨️ 打印标签</h4><div class="row"><div class="field"><label>规格</label><input type="text" id="pSpec"></div><div class="field"><label>色号</label><input type="text" id="pColor"></div><div class="field"><label>机号</label><input type="text" id="pMachine"></div><div class="field"><label>数量</label><input type="number" id="pQty"></div><div class="field"><label>毛重</label><input type="number" id="pGross"></div><div class="field"><label>筒重</label><input type="number" id="pTong"></div><div class="field"><label>箱重</label><input type="number" id="pBox"></div><div class="field"><label>净重</label><input type="text" id="pNet" readonly></div><div class="field"><label>包装</label><input type="text" id="pHandler"></div><div class="field"><label>批号</label><input type="text" id="pBatch"></div><button id="printBtn">🖨️ 打印</button></div></div></div>
    `;
    document.getElementById('main').innerHTML=html;
    renderTables();
    bindEvents();
}

function renderTables(){
    let inList=document.getElementById('inList');
    if(inList)inList.innerHTML=ins.map(i=>`<tr>
        <td>${escape(i.customer||'待分配')}${i.is_waste?'(废置)':''}</td>
        <td>${escape(i.model)}${i.waste_reason?'('+i.waste_reason+')':''}${i.is_waste?'<span style="color:red">已废置</span>':''}</td>
        <td>${i.weight} kg</div></div></td>
        <td>${i.date}</div></div></td>
        <td><span class="status ${i.customer==='待分配'||!i.customer?'status-pending':'status-done'}">${i.customer==='待分配'||!i.customer?'待分配':'已入库'}</span></td>
        <td><button class="btn-del" onclick="delIn('${i.id}')">🗑️</button>${(i.customer==='待分配'||!i.customer)&&!i.is_waste?`<button class="btn-del" onclick="assignOrder('${i.id}','${escape(i.model)}')">📌分配</button>`:''}您
    </tr>`).join('')||'<tr><td colspan="6" class="empty">暂无</div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div>

function bindEvents(){
    document.getElementById('addInBtn')?.onclick=async()=>{
        let c=document.getElementById('inCus').value||'待分配';
        let m=document.getElementById('inModel').value;
        let w=parseFloat(document.getElementById('inWeight').value);
        let d=document.getElementById('inDate').value||new Date().toISOString().slice(0,10);
        if(!m||isNaN(w)){alert("请填型号和重量");return;}
        await supabase.from('in_records').insert({id:Date.now().toString(),customer:c,model:m,weight:w,date:d});
        await loadAll();
        document.getElementById('inCus').value='';document.getElementById('inModel').value='';document.getElementById('inWeight').value='';
    };
    document.getElementById('addOutBtn')?.onclick=async()=>{
        let c=document.getElementById('outCus').value||'-';
        let m=document.getElementById('outModel').value;
        let w=parseFloat(document.getElementById('outWeight').value);
        let d=document.getElementById('outDate').value||new Date().toISOString().slice(0,10);
        if(!m||isNaN(w)){alert("请填型号和重量");return;}
        await supabase.from('out_records').insert({id:Date.now().toString(),customer:c,model:m,weight:w,date:d});
        await loadAll();
        document.getElementById('outCus').value='';document.getElementById('outModel').value='';document.getElementById('outWeight').value='';
    };
    document.getElementById('addOrderBtn')?.onclick=async()=>{
        let c=document.getElementById('orderCus').value||null;
        let s=document.getElementById('orderSpec').value;
        let q=parseFloat(document.getElementById('orderQty').value);
        let r=document.getElementById('orderRemark').value;
        if(!s||isNaN(q)){alert("请填规格和数量");return;}
        let today=new Date();
        let no='D'+today.getFullYear()+String(today.getMonth()+1).padStart(2,'0')+String(today.getDate()).padStart(2,'0')+String(Math.floor(Math.random()*1000)).padStart(3,'0');
        await supabase.from('order_progress').insert({id:Date.now().toString(),order_no:no,customer:c,product_spec:s,quantity:q,remark:r,status:'待生产',created_date:today.toISOString().slice(0,10)});
        await loadAll();
        document.getElementById('orderCus').value='';document.getElementById('orderSpec').value='';document.getElementById('orderQty').value='';document.getElementById('orderRemark').value='';
    };
    document.getElementById('printBtn')?.onclick=()=>{
        let spec=document.getElementById('pSpec').value;
        let batch=document.getElementById('pBatch').value;
        let gross=+document.getElementById('pGross').value||0;
        let tong=+document.getElementById('pTong').value||0;
        let box=+document.getElementById('pBox').value||0;
        let net=gross-tong-box;if(net<0)net=0;
        if(!spec){alert("请填规格");return;}
        if(net>0){supabase.from('in_records').insert({id:Date.now().toString(),customer:`成品-${batch||"无批号"}`,model:spec,weight:net,date:new Date().toISOString().slice(0,10)});loadAll();alert(`已入仓，净重：${net.toFixed(2)} kg`);}
        else{alert(`净重${net.toFixed(2)}kg未入仓`);return;}
        let qrData=JSON.stringify({spec,color:document.getElementById('pColor').value,machine:document.getElementById('pMachine').value,qty:document.getElementById('pQty').value,gross,tong,box,net,handler:document.getElementById('pHandler').value,batch,date:new Date().toISOString().slice(0,10)});
        let qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrData)}`;
        let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>标签</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:white;font-family:SimSun,"宋体"}.label{width:100mm;height:100mm;border:1px solid #000;padding:2mm;margin:0 auto;position:relative}.company{text-align:center;font-size:14pt;font-weight:bold}.address{text-align:center;font-size:9pt}.hr{border-top:0.5px solid #000;margin:1mm 0}.two-col{display:flex;justify-content:space-between}.left-col,.right-col{width:48%}.field{display:flex;margin-bottom:1.5mm}.field-name{width:12mm;font-size:10pt;font-weight:bold}.field-value{font-size:10pt}.qr-area{position:absolute;bottom:2mm;right:2mm;width:15mm;height:15mm}.qr-img{width:100%;height:100%}.footer{text-align:center;font-size:8pt;color:#c00;margin-top:1mm}@page{size:100mm 100mm;margin:0mm}@media print{body{margin:0;padding:0}.label{border:none}}</style></head><body><div class="label"><div class="company">中山市淮鸿橡筋织带有限公司</div><div class="address">地址：中山市三角镇接民村金达路三号B栋五楼</div><div class="address">电话：13535238522</div><div class="hr"></div><div class="two-col"><div class="left-col"><div class="field"><span class="field-name">规格</span><span class="field-value">${escape(spec)}</span></div><div class="field"><span class="field-name">机号</span><span class="field-value">${escape(document.getElementById('pMachine').value)}</span></div><div class="field"><span class="field-name">毛重</span><span class="field-value">${gross.toFixed(2)} kg</span></div><div class="field"><span class="field-name">箱重</span><span class="field-value">${box.toFixed(2)} kg</span></div><div class="field"><span class="field-name">净重</span><span class="field-value">${net.toFixed(2)} kg</span></div><div class="field"><span class="field-name">日期</span><span class="field-value">${new Date().toISOString().slice(0,10)}</span></div></div><div class="right-col"><div class="field"><span class="field-name">色号</span><span class="field-value">${escape(document.getElementById('pColor').value)}</span></div><div class="field"><span class="field-name">数量</span><span class="field-value">${escape(document.getElementById('pQty').value)} 个</span></div><div class="field"><span class="field-name">筒重</span><span class="field-value">${tong.toFixed(2)} kg</span></div><div class="field"><span class="field-name">包装</span><span class="field-value">${escape(document.getElementById('pHandler').value)}</span></div><div class="field"><span class="field-name">批号</span><span class="field-value">${escape(batch)}</span></div></div></div><div class="hr"></div><div class="footer">不同机号、批号分开使用</div><div class="qr-area"><img class="qr-img" src="${qrUrl}"></div></div><script>window.onload=function(){setTimeout(function(){window.print();setTimeout(function(){window.close();},500);},300)};<\/script></body></html>`;
        let iframe=document.createElement('iframe');iframe.style.position='absolute';iframe.style.width='0';iframe.style.height='0';document.body.appendChild(iframe);let doc=iframe.contentWindow.document;doc.open();doc.write(html);doc.close();iframe.contentWindow.focus();iframe.contentWindow.print();setTimeout(()=>document.body.removeChild(iframe),2000);
        document.getElementById('pSpec').value='';document.getElementById('pColor').value='';document.getElementById('pMachine').value='';document.getElementById('pQty').value='';document.getElementById('pGross').value='';document.getElementById('pTong').value='';document.getElementById('pBox').value='';document.getElementById('pNet').value='';document.getElementById('pHandler').value='';document.getElementById('pBatch').value='';
    };
    document.getElementById('pGross')?.addEventListener('input',()=>{let g=+document.getElementById('pGross').value||0,t=+document.getElementById('pTong').value||0,b=+document.getElementById('pBox').value||0;document.getElementById('pNet').value=(g-t-b<0?0:g-t-b).toFixed(2);});
    document.getElementById('pTong')?.addEventListener('input',()=>{let g=+document.getElementById('pGross').value||0,t=+document.getElementById('pTong').value||0,b=+document.getElementById('pBox').value||0;document.getElementById('pNet').value=(g-t-b<0?0:g-t-b).toFixed(2);});
    document.getElementById('pBox')?.addEventListener('input',()=>{let g=+document.getElementById('pGross').value||0,t=+document.getElementById('pTong').value||0,b=+document.getElementById('pBox').value||0;document.getElementById('pNet').value=(g-t-b<0?0:g-t-b).toFixed(2);});
}
function switchTab(tab){
    document.querySelectorAll('#main>[id$="Page"]').forEach(el=>el.style.display='none');
    document.getElementById(tab+'Page').style.display='block';
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
}
window.switchTab=switchTab;
window.delIn=async(id)=>{if(confirm('删除？')){await supabase.from('in_records').delete().eq('id',id);await loadAll();}};
window.delOut=async(id)=>{if(confirm('删除？')){await supabase.from('out_records').delete().eq('id',id);await loadAll();}};
window.delOrder=async(id)=>{if(confirm('删除？')){await supabase.from('order_progress').delete().eq('id',id);await loadAll();}};
window.assignOrder=async(inId,model)=>{let pending=orders.filter(o=>o.product_spec===model&&o.status==='待生产');if(!pending.length){alert('无匹配订单');return;}let list=pending.map((o,i)=>`${i+1}. ${o.order_no} ${o.customer||''}`).join('\n');let idx=prompt(`选择订单序号:\n${list}`)-1;if(idx>=0&&idx<pending.length){let matched=pending[idx];await supabase.from('order_progress').update({status:'已入库'}).eq('id',matched.id);await supabase.from('in_records').update({customer:matched.customer||'已分配'}).eq('id',inId);await loadAll();alert(`已关联 ${matched.order_no}`);}};
function escape(str){if(!str)return '';return String(str).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
loadAll();
</script>
</body>
</html>
